<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Devin Mobile</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --blue: #58a6ff;
    --accent: #1f6feb;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px;
    padding-bottom: 80px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  header .refresh {
    margin-left: auto; background: none; border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  header .refresh:active { background: var(--border); }

  .session {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    margin: 10px 12px; padding: 14px; cursor: pointer; transition: border-color .15s;
  }
  .session:active { border-color: var(--accent); }
  .session-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.idle { background: var(--muted); }
  .session-title { font-size: 14px; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-meta { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .session-id { font-family: monospace; font-size: 11px; color: var(--muted); }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: 500; }
  .badge.active { background: rgba(63,185,80,.15); color: var(--green); }
  .badge.idle { background: rgba(139,148,158,.15); color: var(--muted); }

  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }

  /* Modal de prompt */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50;
    display: none; align-items: flex-end; justify-content: center;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px 14px 0 0;
    width: 100%; max-width: 600px; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom));
  }
  .modal h2 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .modal .sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; font-family: monospace; }
  .modal textarea {
    width: 100%; min-height: 80px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 14px;
    font-family: inherit; resize: vertical; outline: none;
  }
  .modal textarea:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn {
    border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .btn-send { background: var(--accent); color: #fff; flex: 1; }
  .btn-send:active { background: #388bfd; }
  .btn-send:disabled { opacity: .5; }
  .btn-cancel { background: var(--border); color: var(--text); }
  .btn-cancel:active { background: #3d4449; }

  .response {
    margin-top: 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; font-size: 13px; white-space: pre-wrap; word-break: break-word;
    max-height: 300px; overflow-y: auto; display: none;
  }
  .response.show { display: block; }
  .response.error { border-color: var(--red); color: var(--red); }

  /* Historial de mensajes */
  .history {
    margin-top: 8px; max-height: 250px; overflow-y: auto; display: none;
  }
  .history.show { display: block; }
  .hist-msg { margin-bottom: 8px; padding: 8px 10px; border-radius: 8px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .hist-msg.user { background: rgba(31,111,235,.12); border-left: 3px solid var(--accent); }
  .hist-msg.assistant { background: rgba(63,185,80,.08); border-left: 3px solid var(--green); }
  .hist-msg .role { font-size: 11px; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; }
  .hist-loading { color: var(--muted); text-align: center; padding: 20px; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid var(--muted);
    border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Login */
  #login {
    position: fixed; inset: 0; background: var(--bg); z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
  }
  #login h1 { font-size: 22px; margin: 0 0 6px; }
  #login p { color: var(--muted); font-size: 13px; margin: 0 0 20px; text-align: center; }
  #login input {
    width: 100%; max-width: 320px; background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 14px; outline: none;
    margin-bottom: 12px;
  }
  #login input:focus { border-color: var(--accent); }
  #login button {
    width: 100%; max-width: 320px; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 500; cursor: pointer;
  }
  #login .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>

<div id="login">
  <h1>Devin Mobile</h1>
  <p>Introduce tu usuario y contraseña</p>
  <input id="userInput" type="text" placeholder="Usuario" autocomplete="off">
  <input id="passInput" type="password" placeholder="Contraseña" autocomplete="off">
  <button id="loginBtn">Entrar</button>
  <div class="err" id="loginErr"></div>
</div>

<header style="display:none" id="appHeader">
  <span class="dot"></span>
  <h1>Devin Mobile</h1>
  <button class="refresh" id="refreshBtn">Actualizar</button>
</header>

<div id="sessionList"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Enviar prompt</h2>
    <div class="sub" id="modalSessionId"></div>
    <div class="history" id="historyBox">
      <div class="hist-loading">Cargando historial...</div>
    </div>
    <textarea id="promptText" placeholder="Escribe tu prompt..." style="margin-top:10px"></textarea>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="cancelBtn">Cancelar</button>
      <button class="btn btn-send" id="releaseBtn" style="background:var(--yellow);color:#000">Liberar</button>
      <button class="btn btn-send" id="sendBtn">Enviar</button>
    </div>
    <div class="response" id="responseBox"></div>
  </div>
</div>

<script>
const CRED_KEY = 'devin_mobile_cred';
let credB64 = localStorage.getItem(CRED_KEY) || '';
let currentSessionId = null;

const $ = id => document.getElementById(id);

function authHeaders() {
  const h = { 'Content-Type': 'application/json' };
  if (credB64) h['Authorization'] = 'Basic ' + credB64;
  return h;
}

async function checkAuth() {
  if (!credB64) { showLogin(); return; }
  try {
    const r = await fetch('/api/health', { headers: authHeaders() });
    if (!r.ok) throw new Error();
    hideLogin();
    loadSessions();
  } catch {
    showLogin();
  }
}

function showLogin() {
  $('login').style.display = 'flex';
  $('appHeader').style.display = 'none';
  $('sessionList').innerHTML = '';
}
function hideLogin() {
  $('login').style.display = 'none';
  $('appHeader').style.display = 'flex';
}

$('loginBtn').addEventListener('click', async () => {
  const user = $('userInput').value.trim();
  const pwd = $('passInput').value;
  if (!user || !pwd) { $('loginErr').textContent = 'Introduce usuario y contraseña'; return; }
  $('loginErr').textContent = '';
  $('loginBtn').disabled = true;
  $('loginBtn').textContent = '...';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pwd }),
    });
    if (r.ok) {
      credB64 = btoa(user + ':' + pwd);
      localStorage.setItem(CRED_KEY, credB64);
      hideLogin();
      loadSessions();
    } else {
      $('loginErr').textContent = 'Usuario o contraseña incorrectos';
    }
  } catch (e) {
    $('loginErr').textContent = 'Error de conexion';
  }
  $('loginBtn').disabled = false;
  $('loginBtn').textContent = 'Entrar';
});
$('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
$('userInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('passInput').focus(); });

async function loadSessions() {
  const list = $('sessionList');
  list.innerHTML = '<div class="empty">Cargando sesiones...</div>';
  try {
    const r = await fetch('/api/sessions', { headers: authHeaders() });
    if (!r.ok) { if (r.status === 401) { showLogin(); return; } throw new Error(); }
    const sessions = await r.json();
    if (!sessions.length) { list.innerHTML = '<div class="empty">No hay sesiones</div>'; return; }
    list.innerHTML = sessions.map(s => {
      const cls = s.active ? 'active' : 'idle';
      const label = s.active ? 'Activa' : 'Inactiva';
      const title = escapeHtml(s.title || '(sin titulo)');
      const ago = escapeHtml(s.last_activity_ago || '');
      const iso = escapeHtml(s.last_activity_iso || '');
      const dir = escapeHtml(s.working_directory_display || s.working_directory || '');
      return `<div class="session" onclick="openPrompt('${s.id}')">
        <div class="session-header">
          <span class="status-dot ${cls}"></span>
          <span class="session-title">${title}</span>
          <span class="badge ${cls}">${label}</span>
        </div>
        <div class="session-meta">
          <span>${ago}</span>
          <span class="session-id">${s.id}</span>
        </div>
        <div class="session-meta"><span>${dir}</span></div>
      </div>`;
    }).join('');
  } catch (e) {
    list.innerHTML = '<div class="empty">Error al cargar sesiones</div>';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openPrompt(id) {
  currentSessionId = id;
  $('modalSessionId').textContent = id;
  $('promptText').value = '';
  $('responseBox').className = 'response';
  $('responseBox').textContent = '';
  $('sendBtn').disabled = false;
  $('sendBtn').textContent = 'Enviar';
  $('historyBox').className = 'history show';
  $('historyBox').innerHTML = '<div class="hist-loading">Cargando historial...</div>';
  $('overlay').classList.add('show');
  loadHistory(id);
  setTimeout(() => $('promptText').focus(), 100);
}

async function loadHistory(id) {
  try {
    const r = await fetch(`/api/sessions/${id}/history`, { headers: authHeaders() });
    if (!r.ok) { $('historyBox').innerHTML = ''; return; }
    const msgs = await r.json();
    if (!msgs.length) { $('historyBox').innerHTML = '<div class="hist-loading">Sin mensajes previos</div>'; return; }
    $('historyBox').innerHTML = msgs.map(m => {
      const cls = m.role === 'user' ? 'user' : 'assistant';
      const roleLabel = m.role === 'user' ? 'Tu' : 'Devin';
      const content = escapeHtml(m.content);
      const time = m.time_iso ? `<span style="float:right">${m.time_iso}</span>` : '';
      return `<div class="hist-msg ${cls}"><div class="role">${roleLabel}${time}</div>${content}</div>`;
    }).join('');
    // Scroll al final
    $('historyBox').scrollTop = $('historyBox').scrollHeight;
  } catch (e) {
    $('historyBox').innerHTML = '<div class="hist-loading">Error al cargar historial</div>';
  }
}

$('cancelBtn').addEventListener('click', () => $('overlay').classList.remove('show'));
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) $('overlay').classList.remove('show'); });

$('sendBtn').addEventListener('click', async () => {
  const prompt = $('promptText').value.trim();
  if (!prompt || !currentSessionId) return;
  $('sendBtn').disabled = true;
  $('sendBtn').innerHTML = '<span class="spinner"></span> Enviando...';
  const rb = $('responseBox');
  rb.className = 'response show';
  rb.textContent = 'Esperando respuesta de Devin...';
  try {
    const r = await fetch(`/api/sessions/${currentSessionId}/prompt`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ prompt }),
    });
    const data = await r.json();
    if (data.ok) {
      rb.className = 'response show';
      rb.textContent = data.output || '(sin output)';
    } else {
      rb.className = 'response show error';
      rb.textContent = data.error || data.output || 'Error';
    }
  } catch (e) {
    rb.className = 'response show error';
    rb.textContent = 'Error de red: ' + e.message;
  }
  $('sendBtn').disabled = false;
  $('sendBtn').textContent = 'Enviar';
});

$('refreshBtn').addEventListener('click', loadSessions);

$('releaseBtn').addEventListener('click', async () => {
  if (!currentSessionId) return;
  $('releaseBtn').disabled = true;
  $('releaseBtn').textContent = '...';
  try {
    await fetch(`/api/sessions/${currentSessionId}/release`, { method: 'POST', headers: authHeaders() });
    $('releaseBtn').textContent = 'OK';
    setTimeout(() => { $('releaseBtn').textContent = 'Liberar'; $('releaseBtn').disabled = false; }, 1500);
  } catch (e) {
    $('releaseBtn').textContent = 'Error';
    setTimeout(() => { $('releaseBtn').textContent = 'Liberar'; $('releaseBtn').disabled = false; }, 1500);
  }
});

// Auto-refresh cada 15s
setInterval(() => { if (credB64 && $('login').style.display === 'none') loadSessions(); }, 15000);

checkAuth();
</script>
</body>
</html>
